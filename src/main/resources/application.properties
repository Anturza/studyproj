# Database connection URL, including the host, port (default 5432), and database name
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
# Database username
spring.datasource.username=postrges
# Database password
spring.datasource.password=qwerty
# The driver class name (optional for modern Spring Boot, as it detects from the URL)
spring.datasource.driverClassName=org.postgresql.Driver
# Shows the SQL queries generated by Hibernate in the console (useful for debugging)
spring.jpa.show-sql=true
# Configures the Hibernate DDL (Data Definition Language) behavior on application startup
# Options: none, update, create, create-drop, validate
# - update: updates the schema based on your entities
# - create-drop: creates the schema and drops it when the application stops
spring.jpa.hibernate.ddl-auto=update
# Specifies the SQL dialect for PostgreSQL (helps Hibernate generate optimized SQL)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect # Often auto-detected in modern Spring Boot
# Disables the "Open EntityManager in View" pattern, improving performance in web apps
spring.jpa.open-in-view=false